<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - HLMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-wrap">
      <h1>📚 HLMS</h1>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/books">Books</a>
        <a href="/login">Login</a>
        <a href="/register">Register</a>
      </div>
    </div>
  </nav>

  <main class="container auth-section">
    <section class="auth-form">
      <h2>Forgot Password</h2>
      <p style="margin-bottom:1rem;color:#555;">Enter your registered email address and we will generate a password reset link.</p>
      <form id="fp-form" onsubmit="return handleForgotPassword(event)">
        <div class="form-group">
          <label for="fp-email">Email</label>
          <input id="fp-email" type="email" required>
        </div>
        <button type="submit" class="btn btn-primary">Send Reset Link</button>
      </form>
      <p style="margin-top:1rem;"><a href="/login">Back to Login</a></p>
      <div id="fp-message"></div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
