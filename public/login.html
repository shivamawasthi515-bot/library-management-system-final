<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HLMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-wrap">
      <h1>📚 HLMS</h1>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/books">Books</a>
        <a href="/login">Login</a>
        <a href="/register">Register</a>
      </div>
    </div>
  </nav>

  <main class="container auth-section">
    <section class="auth-form">
      <h2>Login</h2>
      <form onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
      </form>
      <p>New user? <a href="/register">Create account</a> &nbsp;|&nbsp; <a href="/forgot-password">Forgot password?</a></p>
      <p id="setup-link" style="display:none;margin-top:0.5rem;">
        First time here? <a href="/setup">Create the admin account</a>
      </p>
      <div id="login-message"></div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    checkSetupAPI().then(function(data) {
      if (data.setupNeeded) document.getElementById('setup-link').style.display = 'block';
    }).catch(function() {});
  </script>
</body>
</html>
