<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hybrid Library Management System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-wrap">
      <h1>📚 Hybrid Library Management System</h1>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/books">Books</a>
        <a id="nav-dashboard" href="/dashboard" style="display:none;">Dashboard</a>
        <a id="nav-admin" href="/admin" style="display:none;">Admin</a>
        <a href="/login">Login</a>
        <a href="/register">Register</a>
        <span id="nav-user"></span>
        <button id="nav-logout" class="btn btn-small" style="display:none;">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <section class="hero">
      <h2>Find, Borrow, and Manage Hybrid Library Resources</h2>
      <p>Search physical + digital books with local smart ranking (text + fuzzy search).</p>
      <a href="/books" class="btn">Browse Books</a>
      <a href="/dashboard" class="btn btn-primary">My Dashboard</a>
    </section>

    <section id="status" class="section">
      <h2>System Health</h2>
      <div id="status-info"></div>
    </section>

    <section id="featured-books" class="section">
      <h2>Recent Books</h2>
      <div id="featured-list"></div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
