<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - HLMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-wrap">
      <h1>📚 HLMS</h1>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/books">Books</a>
        <a href="/login">Login</a>
      </div>
    </div>
  </nav>

  <main class="container auth-section">
    <section class="auth-form">
      <h2>Reset Password</h2>
      <form id="rp-form" onsubmit="return handleResetPassword(event)">
        <div class="form-group">
          <label for="rp-password">New Password (min 6 chars)</label>
          <input id="rp-password" type="password" minlength="6" required>
        </div>
        <div class="form-group">
          <label for="rp-confirm">Confirm New Password</label>
          <input id="rp-confirm" type="password" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary">Reset Password</button>
      </form>
      <div id="rp-message"></div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
