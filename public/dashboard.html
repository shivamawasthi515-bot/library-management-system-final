<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - HLMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-wrap">
      <h1>📚 HLMS</h1>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/books">Books</a>
        <a id="nav-dashboard" href="/dashboard" style="display:none;">Dashboard</a>
        <a id="nav-admin" href="/admin" style="display:none;">Admin</a>
        <span id="nav-user"></span>
        <button id="nav-logout" class="btn btn-small" style="display:none;">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <section class="section">
      <h2 id="dashboard-title">Dashboard</h2>
      <div id="borrow-list"></div>
    </section>

    <section class="section">
      <h2>Submit Feedback</h2>
      <form onsubmit="return submitUserFeedback(event)">
        <div class="form-group">
          <label for="feedback-rating">Rating</label>
          <select id="feedback-rating">
            <option value="5">5</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
          </select>
        </div>
        <div class="form-group">
          <label for="feedback-message">Feedback</label>
          <textarea id="feedback-message" rows="4" required></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Submit</button>
      </form>
      <div id="feedback-status"></div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
