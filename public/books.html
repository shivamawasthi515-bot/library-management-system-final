<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books - Library Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <h1>📚 Library Management System</h1>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/books">Books</a>
        <a href="/login">Login</a>
        <a href="/register">Register</a>
	<span id="nav-user" style="color:white; font-weight:600;"></span>
<button id="nav-logout" style="display:none;" class="btn">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <section class="section">
      <h2>📖 Books Catalog</h2>
      
      <div class="search-section">
        <input type="text" id="searchInput" placeholder="Search books...">
        <button onclick="searchBooks()" class="btn">Search</button>
        <button onclick="loadAllBooks()" class="btn">Show All</button>
      </div>

      <div id="books-list"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/books.js"></script>
  <script src="js/nav.js"></script>	
</body>
</html>
