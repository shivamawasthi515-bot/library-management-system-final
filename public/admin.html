<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - HLMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-wrap">
      <h1>📚 HLMS Admin</h1>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/books">Books</a>
        <a id="nav-dashboard" href="/dashboard" style="display:none;">Dashboard</a>
        <a id="nav-admin" href="/admin" style="display:none;">Admin</a>
        <a id="nav-profile" href="/profile" style="display:none;">Profile</a>
        <span id="nav-user"></span>
        <button id="nav-logout" class="btn btn-small" style="display:none;">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <section class="section">
      <h2>Add Book</h2>
      <form id="book-form" onsubmit="return createBook(event)">
        <div class="form-group"><label for="book-title">Title</label><input id="book-title" required></div>
        <div class="form-group"><label for="book-authors">Authors (comma-separated)</label><input id="book-authors" required></div>
        <div class="form-group"><label for="book-type">Type</label>
          <select id="book-type">
            <option value="physical">physical</option>
            <option value="digital">digital</option>
            <option value="hybrid">hybrid</option>
          </select>
        </div>
        <div class="form-group"><label for="book-copies">Total copies</label><input id="book-copies" type="number" min="1" value="1"></div>
        <div class="form-group"><label for="book-category">Category</label><input id="book-category"></div>
        <div class="form-group"><label for="book-cover">Cover Image URL</label><input id="book-cover" placeholder="https://…/cover.jpg"></div>
        <div class="form-group"><label for="book-digital">Digital Resource URL</label><input id="book-digital" placeholder="https://…"></div>
        <div class="form-group"><label for="book-file">File / PDF URL</label><input id="book-file" placeholder="https://…/book.pdf"></div>
        <div class="form-group"><label for="book-description">Description</label><textarea id="book-description" rows="3"></textarea></div>
        <button class="btn btn-primary" type="submit">Create</button>
      </form>
      <div id="book-status"></div>
    </section>

    <section class="section"><h2>Books Management</h2><div id="admin-books-list"></div></section>
    <section class="section">
      <h2>Users</h2>
      <div class="search-section" style="margin-bottom:0.5rem;">
        <input id="admin-users-search" type="text" placeholder="Search by name or email…" style="max-width:300px;"
          onkeyup="if(event.key==='Enter'){loadUsers(1);}">
        <button class="btn btn-small" onclick="loadUsers(1)">Search</button>
      </div>
      <div id="admin-users"></div>
    </section>
    <section class="section"><h2>Borrowing Records</h2><div id="admin-borrows"></div></section>
    <section class="section"><h2>Search Analytics</h2><div id="admin-searches"></div></section>
    <section class="section"><h2>Feedback</h2><div id="admin-feedback"></div></section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
